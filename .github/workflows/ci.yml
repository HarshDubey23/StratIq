name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: strataiq
          POSTGRES_PASSWORD: strataiq
          POSTGRES_DB: strataiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strataiq" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://strataiq:strataiq@localhost:5432/strataiq
      JWT_SECRET: ci-secret-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests (engine, providers, API + PostGIS)
        run: |
          set -o pipefail
          pytest -v -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface test failures as annotations
        if: failure()
        run: |
          [ -f pytest.log ] || exit 0
          python3 - <<'PY'
          import re
          log = open("pytest.log").read()
          blocks = re.split(r"\n_{5,} ", log)
          for b in blocks[1:9]:
              msg = b[:3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=pytest::{msg}")
          tail = log[-3000:].replace("%", "%25").replace("\n", "%0A")
          print(f"::error title=pytest-summary::{tail}")
          PY

  backend-live:
    # Real calls to OpenStreetMap / WorldPop to prove the live data path works.
    # Public services can rate-limit, so this job is informative rather than blocking.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUN_LIVE: "1"
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: |
          set -o pipefail
          pytest -v -s -rA -m live tests/test_live.py 2>&1 | tee live.log
      - if: always()
        run: |
          [ -f live.log ] || exit 0
          python3 - <<'PY'
          import re
          log = open("live.log").read()
          keep = [l for l in log.splitlines() if re.search(r"(PASSED|FAILED|ERROR|gyms found|population 1km|^status |Error:|ProviderError)", l)]
          print("::notice title=live-summary::" + "%0A".join(x.replace("%", "%25")[:400] for x in keep[:40]))
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Lint
        run: npm run lint
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Surface frontend errors as annotations
        if: failure()
        run: |
          for f in tsc.log build.log; do [ -f $f ] && python3 -c "import sys;l=open('$f').read()[-3800:];print('::error title=$f::'+l.replace('%','%25').replace(chr(10),'%0A'))"; done; true

  e2e:
    # Full stack in CI: PostGIS + FastAPI + Next.js production build, driven by a real browser.
    # Screenshots and the journey log are pushed to the `e2e-results` branch for review.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: strataiq
          POSTGRES_PASSWORD: strataiq
          POSTGRES_DB: strataiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strataiq" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://strataiq:strataiq@localhost:5432/strataiq
      JWT_SECRET: ci-secret-not-for-production
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          nohup npm start > ../web.log 2>&1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && curl -sf -o /dev/null http://127.0.0.1:3000 && exit 0; sleep 2; done; exit 1
      - name: Run journey
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node journey.mjs
      - name: Publish results to e2e-results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r e2e/out/* /tmp/res/ 2>/dev/null || true
          cp api.log web.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q -b e2e-results
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "e2e results for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" e2e-results
      - name: Journey log
        if: always()
        run: |
          [ -f e2e/out/journey.log ] && python3 -c "l=open('e2e/out/journey.log').read()[-3800:];print('::notice title=journey::'+l.replace('%','%25').replace(chr(10),'%0A'))" || true
