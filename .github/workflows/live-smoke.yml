name: Live smoke test

# Runs the judge journey against the PUBLIC deployment after each push to main
# (Vercel builds take a few minutes) and publishes screenshots to the `live-results` branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BASE_URL: https://strataiq-rho.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the new deployment
        run: |
          sleep 480
          for i in $(seq 1 30); do curl -sf https://strataiq-api.vercel.app/api/health && break; sleep 10; done
      - name: Journey on live URL
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node live.mjs
      - name: Publish results to live-results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r e2e/out-live/* /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q -b live-results
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "live results for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live-results
